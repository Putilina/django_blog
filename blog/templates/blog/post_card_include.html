{% load static %}

<article class="post-card{% if post.rating > 3 %} post-card--featured{% endif %}">
    <button type="button"
            class="post-card__refresh"
            hx-get="{% url 'post_card_fragment' post_slug=post.slug %}"
            hx-target="#card-body-{{ post.slug }}"
            hx-swap="innerHTML">
        Обновить
    </button>

    <div class="post-card__body" id="card-body-{{ post.slug }}">
        {% include "blog/post_card_body.html" %}
    </div>
</article>
