{% extends "blog/base.html" %}
{% load static %}

{% block title %}Лента публикаций{% endblock title %}

{% block content %}
    <h1>{{ page_title }}</h1>

    <form class="search-form"
          hx-get="{% url 'home' %}"
          hx-trigger="input changed delay:500ms from:input[name='q'], change from:input[name='cat']"
          hx-target="#results"
          hx-swap="innerHTML"
          hx-indicator="#results">
        
        <label for="search">Поиск:</label>
        <input type="search" id="search" name="q" value="{{ q }}" placeholder="Введите заголовок...">
        
        <fieldset class="search-cats">
            <legend>Категория:</legend>
            <label>
                <input type="radio" name="cat" value="" {% if not cat %}checked{% endif %}>
                Все категории
            </label>
            {% for category_item in categories %}
                <label>
                    <input type="radio" name="cat" value="{{ category_item.name }}" {% if cat == category_item.name %}checked{% endif %}>
                    {{ category_item.name }}
                </label>
            {% endfor %}
        </fieldset>
        
        <a href="{% url 'home' %}">Сбросить</a>
    </form>

    <section id="results">
        {% include "blog/post_list_results.html" %}
    </section>
{% endblock content %}
